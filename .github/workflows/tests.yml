name: Tests CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.6'
      - name: Test using Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: pnpm install
      - run: pnpm test:ci
